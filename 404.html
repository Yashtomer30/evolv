<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, viewport-fit=cover">
<title>Page not found — EVOLV LABS</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/images/APRKzuh8aVPIUxgP7fLM7GGAqI.png">
<style>
  :root {
    --cream: #f1efe2;
    --ink: #000;
    --muted: #575757;
    --purple: #711bfe;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: "Inter Tight", Inter, -apple-system, BlinkMacSystemFont,
                 "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 16px;
  }
  main { max-width: 540px; width: 100%; }
  .code {
    display: inline-block;
    background: var(--purple);
    color: #fff;
    font-size: 13px;
    letter-spacing: .14em;
    text-transform: uppercase;
    padding: 7px 12px;
    margin-bottom: 28px;
  }
  h1 {
    font-size: clamp(2.25rem, 8vw, 3.5rem);
    line-height: 1.04;
    letter-spacing: -.03em;
    margin: 0 0 18px;
  }
  p { color: var(--muted); font-size: 1.0625rem; line-height: 1.6; margin: 0 0 32px; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; }
  a.btn {
    display: inline-flex;
    align-items: center;
    min-height: 48px;
    padding: 0 22px;
    font-weight: 600;
    font-size: .9375rem;
    text-decoration: none;
    border: 1px solid var(--ink);
    transition: background .18s ease, color .18s ease;
  }
  a.primary { background: var(--ink); color: var(--cream); }
  a.primary:hover { background: var(--purple); border-color: var(--purple); }
  a.ghost { color: var(--ink); }
  a.ghost:hover { background: var(--ink); color: var(--cream); }
</style>
</head>
<body>
  <main>
    <span class="code">Error 404</span>
    <h1>This page doesn&rsquo;t exist.</h1>
    <p>The link may be out of date, or the page may have moved. Everything else is still where you left it.</p>
    <div class="actions">
      <a class="btn primary" href="/">Back to home</a>
      <a class="btn ghost" href="/contact/">Book a call</a>
    </div>
  </main>
</body>
</html>
